<div x-data="errors_dialog('One or more Errors occured!')" @error-occurred.window="onErrorOccurred($event.detail)">
  <dialog class="modal" aria-labelledby="errors-title" @click.self="closeDialog()">
    <div class="modal__head">
      <h2 class="modal__title" id="errors-title" x-text="title"></h2>
      <button type="button" class="close-button close-button--boxed" aria-label="Close" @click="closeDialog()">&times;</button>
    </div>
    <div class="modal__body">
      <template x-for="(error, index) in errors" :key="index">
        <p x-text="error"></p>
      </template>
    </div>
  </dialog>
</div>
