################################################################
# Site settings
################################################################
title                   : "Binacle.Net"

# The site-level fallback. Every page writes its own `description` in front matter - this one is what the
# homepage uses and what anything that forgot would fall back to. It is never derived from the excerpt:
# deriving it is what truncated the old site's snippet mid-word.
description             : >-
  Binacle.Net answers which box an order goes in, in milliseconds. A free and open source 3D bin packing API
  you host yourself, in one Docker command.

# The link-preview image every page falls back to. Square today, so twitter_card stays `summary`.
# Both change together the day a 1200x630 image exists.
og_image                : /media/logo/binacle-logo-512x512.png

author:
  name                  : "Chris Mavrommatis"
  url                   : "https://github.com/ChrisMavrommatis"

# Every absolute URL on the site is derived from this through `absolute_url`, so the host is named on one
# line and nowhere else in the build.
url                     : "http://localhost:7197"
api_url                 : "https://localhost:7194"
gtm                     : ''

logo:
  src                   : /media/logo/binacle-logo-16x16.svg
  alt                   : "Binacle.Net Logo"

default_theme: "dark"
theme_storage: "cookie"
################################################################
# Where things are
################################################################
source              : ./
destination         : ../../artifacts/www
collections_dir     : collections
plugins_dir         : _plugins       # takes an array of strings and loads plugins in that order
layouts_dir         : _layouts
includes_dir        : _includes
data_dir            : _data
# No `sass:` block, and that is deliberate. The sass CLI compiles _sass/main.scss to css/main.css from
# package.json, the way api/src/Binacle.Net.UIModule does. Adding the block back gives two compilers a claim
# on the same files.

################################################################
# Handling Reading
################################################################
safe                : false
include             :
  - ".htaccess"
exclude             :
  - "Gemfile"
  - "Gemfile.lock"
  - "node_modules"
  - "vendor/bundle/"
  - "vendor/cache/"
  - "vendor/gems/"
  - "vendor/ruby/"
  - "*.proj"
  - "obj/*"
  - "bin/*"
  - "README.md"
  - "_js"
  - "package.json"
  - "package-lock.json"
  - "webpack.config.js"
  - "tsconfig.json"
keep_files          : [".git", ".svn"]
encoding            : "utf-8"
markdown_ext        : "markdown,mkdown,mkdn,mkd,md"
strict_front_matter : false

################################################################
# Filtering Content
################################################################
show_drafts         : false
limit_posts         : 0
future              : false
unpublished         : false

################################################################
# Serving
################################################################
detach              : false
port                : 7197
host                : 127.0.0.1
baseurl             : ""    # does not include hostname
show_dir_listing    : false
disable_disk_cache  : true

################################################################
# Conversion
################################################################
markdown            : kramdown
highlighter         : rouge
lsi                 : false
excerpt_separator   : "\n\n"
incremental         : false

################################################################
# Outputting
################################################################
permalink           : date        #pretty
paginate_path       : /page:num
timezone            : "Europe/Athens"
quiet               : false
verbose             : false
liquid:
  error_mode        : warn
  strict_filters    : false
  strict_variables  : false

################################################################
# Markdown Processors
################################################################
kramdown:
  auto_ids          : true
  entity_output     : as_char
  toc_levels        : '1..6'
  smart_quotes      : lsquo,rsquo,ldquo,rdquo
  input             : GFM
  hard_wrap         : false
  footnote_nr       : 1
  show_warnings     : false
  parse_block_html  : true

################################################################
# Plugins
################################################################
whitelist           : []
plugins             :
  - jekyll-tidy
  - jekyll-gtm
  - jekyll-filters
  - jekyll-multi-sitemap
  - jekyll-resource-tags
  - jekyll-page-meta
  - jekyll-structured-data

################################################################
# Front Matter Defaults
################################################################
defaults:
  -
    scope:
      path            : "pages/**"
      type            : "pages"
    values:
      layout          : "default"
      locale          : "en_US"
      hreflang        : "en"
      nav:
        order         : 99
      sitemap:
        lastmod       : "current"
        changefreq    : "monthly"
        priority      : 1.0
        exclude       : false

################################################################
################### END OF BASE CONFIG #####################
################################################################

################################################################
# jekyll-tidy
################################################################
jekyll_tidy:
  exclude       :         # an array of files to exclude from tidying.
    - "**/*.txt"
    - "**/*.json"
    - "*.xml"
  ignore_env    : null     # a JEKYLL_ENV string on which to skip tidying entirely.
  compress_html : false    # a flag for whether or not to compress the HTML output

################################################################
# jekyll-multi-sitemap
################################################################
sitemaps:
  path: /                  # /sitemap.xml is the path a crawler probes unasked
  files:
    - name: sitemap
      include: [pages]

################################################################
# jekyll-page-meta
################################################################
page_meta:
  title_separator: " - "

################################################################
# jekyll-structured-data
################################################################
structured_data:
  # Written out in full, and identical in all three configs. Derived from site.url it would be a
  # different organisation on each host.
  organization:
    "@id": https://www.binacle.net/#organization
    name: Binacle.Net
    url: https://www.binacle.net/
    logo: /media/logo/binacle-logo-512x512.png
    same_as:
      - https://github.com/binacle-labs
      - https://hub.docker.com/r/binacle/binacle-net
  defaults:
    SoftwareApplication:
      applicationCategory: DeveloperApplication
      operatingSystem: Docker
      license: https://spdx.org/licenses/GPL-3.0-only.html
      codeRepository: https://github.com/binacle-labs/Binacle.Net
      offers:
        "@type": Offer
        price: "0"
        priceCurrency: USD
