<header class="site-header">
  <div class="shell header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}">
        <img src="{{ site.logo.src | relative_url }}" alt="" width="28" height="28">
        <span>{{ site.data.header.wordmark }}</span>
    </a>

    <nav class="site-nav" aria-label="Main">
        {%- for item in site.data.header.nav -%}
        {%- if item.external -%}
        <a href="{{ item.url }}">{{ item.title }}</a>
        {%- else -%}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
        {%- endif -%}
        {%- endfor -%}
    </nav>

    <theme-switcher data-button-class="theme-toggle">
        <span data-theme-label>Theme</span>
    </theme-switcher>
  </div>
</header>
