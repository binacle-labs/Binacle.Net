<svg class="drawing__art drawing__art--lockers" viewBox="-4 -137.1 359.9 208.4" role="img" aria-label="A bank of parcel lockers with its top row open: a compartment 8 high, one 19 high and one 41 high. The boxed kettle, 28 high, stands in the 41. In front of the 8 and the 19 it stands just outside the opening, and a dashed red outline carries it on above the top edge of the door frame: it is too tall to go in.">
