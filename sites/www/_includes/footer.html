<footer class="site-footer">
  <div class="shell">
    <p>
        <span>{{ site.data.footer.copyright | expand_year }}</span>
        <span aria-hidden="true">&middot;</span>
        <a href="{{ site.data.footer.license.url }}">{{ site.data.footer.license.title }}</a>
        {%- for link in site.data.footer.links %}
        <span aria-hidden="true">&middot;</span>
        <a href="{{ link.url }}">{{ link.title }}</a>
        {%- endfor %}
    </p>
  </div>
</footer>
