{%- assign block = include.block -%}
<div class="exchange">
    <div class="exchange__part">
        <div class="code-block" data-code-block>
            <div class="code-block__head"><p class="http-line code-block__http-line"><span class="http-line__badge http-line__badge--plain">{{ block.method }}</span><span>{{ block.path }}</span></p><button type="button" class="copy-button" data-copy hidden>Copy</button></div>
            <pre class="code-block__pre"><code>{{ block.request | strip | escape }}</code></pre>
        </div>
    </div>
    <div class="exchange__part">
        <p class="label">Response</p>
        <div class="code-block" data-code-block>
            <div class="code-block__head"><p class="http-line code-block__http-line"><span class="http-line__badge http-line__badge--plain">200</span></p><button type="button" class="copy-button" data-copy hidden>Copy</button></div>
            <pre class="code-block__pre"><code>{{ block.response | strip | escape }}</code></pre>
        </div>
    </div>
    {%- if include.verdict %}
    <p class="verdict">{{ include.verdict }}</p>
    {%- endif %}
</div>
