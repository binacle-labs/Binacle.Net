# Every request and response on this site lives here, in one file, and every one of them is a real exchange
# that was run - never hand-written. A response that looks plausible but is not what the API returns is the
# one lie this audience catches, and it is the audience least likely to forgive it.
#
# HOW TO RE-RUN THEM
#   just serve api            then POST the request below to https://localhost:7194
#   or: docker run ... binacle/binacle-net:<tag>   and POST to http://localhost:8080
# Paste the response back verbatim and update `verified` on the block you changed.
#
# Every example is v3. v4 is experimental for the whole 3.0.x line and a marketing page must not hand a
# stranger an unstable contract. The v3 routes are fit/by-custom, fit/by-preset/{preset}, pack/by-custom,
# pack/by-preset/{preset} and GET presets. Anything named fit/bin, fit/smallest-bin or pack/smallest-bin
# is v4 and does not belong on this site.
#
# `parameters` is required on every fit and pack request - a body without it returns 400. Confirmed against
# the API on 23 Aug 2026, so do not trim it out of an example to make one shorter.

fit:
  verified: "2026-08-23, source build of the 3.0.x line"
  method: "POST"
  path: "/api/v3/fit/by-custom"
  request: |
    {
      "parameters": { "algorithm": "FFD" },
      "bins": [
        { "id": "locker-S", "length": 30, "width": 20, "height": 15 },
        { "id": "locker-M", "length": 40, "width": 30, "height": 20 }
      ],
      "items": [
        { "id": "box-a", "quantity": 2, "length": 10, "width": 10, "height": 10 },
        { "id": "box-b", "quantity": 1, "length": 25, "width": 18, "height": 12 }
      ]
    }
  response: |
    {
      "result": "Success",
      "data": [
        {
          "result": "NotAllItemsFit",
          "bin": { "id": "locker-S", "length": 30, "width": 20, "height": 15 },
          "fittedItems": [ { "id": "box-b", "length": 25, "width": 18, "height": 12 } ],
          "unfittedItems": [ { "id": "box-a", "quantity": 2 } ],
          "fittedBinVolumePercentage": 60.0,
          "fittedItemsVolumePercentage": 72.97
        },
        {
          "result": "AllItemsFit",
          "bin": { "id": "locker-M", "length": 40, "width": 30, "height": 20 },
          "fittedItems": [
            { "id": "box-b", "length": 25, "width": 18, "height": 12 },
            { "id": "box-a", "length": 10, "width": 10, "height": 10 },
            { "id": "box-a", "length": 10, "width": 10, "height": 10 }
          ],
          "unfittedItems": [],
          "fittedBinVolumePercentage": 30.83,
          "fittedItemsVolumePercentage": 100
        }
      ]
    }

pack:
  verified: "2026-08-23, source build of the 3.0.x line"
  method: "POST"
  path: "/api/v3/pack/by-custom"
  request: |
    {
      "parameters": { "algorithm": "FFD" },
      "bins": [ { "id": "locker-M", "length": 40, "width": 30, "height": 20 } ],
      "items": [
        { "id": "box-a", "quantity": 2, "length": 10, "width": 10, "height": 10 },
        { "id": "box-b", "quantity": 1, "length": 25, "width": 18, "height": 12 }
      ]
    }
  response: |
    {
      "result": "Success",
      "data": [
        {
          "result": "FullyPacked",
          "bin": { "id": "locker-M", "length": 40, "width": 30, "height": 20 },
          "packedItems": [
            { "id": "box-b", "length": 25, "width": 18, "height": 12, "x": 0,  "y": 0,  "z": 0 },
            { "id": "box-a", "length": 10, "width": 10, "height": 10, "x": 25, "y": 0,  "z": 0 },
            { "id": "box-a", "length": 10, "width": 10, "height": 10, "x": 0,  "y": 18, "z": 0 }
          ],
          "unpackedItems": [],
          "packedItemsVolumePercentage": 100,
          "packedBinVolumePercentage": 30.83
        }
      ]
    }

