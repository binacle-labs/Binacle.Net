    href: '/favicon.ico'
  - rel: 'icon'
    type: 'image/png'
    sizes: '32x32'
    href: '/favicon-32x32.png'
  - rel: 'icon'
    type: 'image/png'
    sizes: '16x16'
    href: '/favicon-16x16.png'
  - rel: 'apple-touch-icon'
