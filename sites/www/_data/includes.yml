    href: '/apple-touch-icon.png'
  - rel: 'manifest'
    href: '/site.webmanifest'

links:
  - rel: 'stylesheet'
    type: 'text/css'
    href: '/css/main.css'

scripts_body_end:
  - type: 'text/javascript'
    src: '/js/main.js'
    defer: true
