# The docs versions, and which one is current.
#
# This file is the single source of truth for the version list: the order below is the order rendered,
# so keep it newest first. Do not rely on Jekyll's own ordering. It sorts by path, which would put
# v3.10.x before v3.2.x.
#
# `current` is the one knob: it names the current folder, points the `latest` redirect, and decides which
# version search engines may index. Every other version is served noindex and is in no sitemap.
#
# A version also needs a `defaults` scope block in _config.yml or it is invisible in the selector.

current: v3.0.x

list:
  - id: v3.0.x
  - id: v2.1.x
  - id: v2.0.x
  - id: v1.3.x
