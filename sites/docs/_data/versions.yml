# The docs versions, and which one is current.
#
# This file is the single source of truth for the version list: the order below is the order rendered,
# so keep it newest first. Do not rely on Jekyll's own ordering. It sorts by path, which would put
# v3.10.x before v3.2.x.
#
# `current` is the one knob: it names the current folder, points the `latest` redirect, and decides which
# version search engines may index. Every other version is served noindex and is in no sitemap.
#
# `version_tag` is a real docker tag, the one every page of that version pulls with. It is NOT the folder
# label: "2.1.x" is not a tag that exists, and writing the label here published a docker run command that
# failed for the reader. A closed line carries its newest patch - it gets no further release, and no moving
# tag was ever published for it. The current line carries a moving tag, which the release workflow publishes
# and which resolves to the newest patch.
#
# Every folder under collections/_versions/ has to be in the list, with its tag. The gem reads the version off
# the folder name and the tag off this list, and stops the build on a folder the list does not have.
#
# Every entry carries all four keys; the build stops on one that does not.
#   id           the folder under collections/_versions/. Never appears in a url.
#   url_segment  where the line renders, /version/<url_segment>/ - the highest version it shipped. The current
#                line renders at the root instead; its segment is where it lands the day it closes.
#   label        what the selector and every page call the line - the highest version it shipped, with its v.
#   version_tag  what docker pulls. A closed line pins its newest patch; the current line a moving tag.

current: v3.x

list:
  - id: v3.x
    url_segment: 3.0.0
    label: v3.0.0
    version_tag: "3.0"
  - id: v2.x
    url_segment: 2.1.1
    label: v2.1.1
    version_tag: "2.1.1"
  - id: v1.x
    url_segment: 1.3.0
    label: v1.3.0
    version_tag: "1.3.0"
