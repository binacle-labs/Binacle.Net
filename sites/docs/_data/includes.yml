# The icon files land in the site root from assets/, copied by gulp.
icons:
  - rel: 'icon'
    href: '/favicon.ico'
  - rel: 'icon'
    type: 'image/png'
    sizes: '32x32'
    href: '/favicon-32x32.png'
  - rel: 'icon'
    type: 'image/png'
    sizes: '16x16'
    href: '/favicon-16x16.png'
  - rel: 'apple-touch-icon'
    sizes: '180x180'
    href: '/apple-touch-icon.png'

links:
  - type: 'text/css'
    rel: 'stylesheet'
    href: '/lib/beercss/beer.min.css'
  - type: 'text/css'
    rel: 'stylesheet'
    href: '/css/main.css'
  - type: 'text/css'
    rel: 'stylesheet'
    href: '/css/pygments.css'


scripts_body_end:
  - type: 'module'
    src: '/lib/beercss/beer.min.js'
  - type: 'text/javascript'
    src: '/js/main.js'

