{% if page.version and page.version != site.data.versions.current %}
<div class="block-warning">
    <p>
        You are reading the documentation for <strong>{{ page.version }}</strong>, which is not the current
        version. It describes that release and is kept for reference — it is not updated.
        <a href="{{ '/version/' | append: site.data.versions.current | append: '/' | relative_url }}">Go to {{ site.data.versions.current }} →</a>
    </p>
</div>
{% endif %}
