<!DOCTYPE html>
<html lang="{{ page.hreflang }}">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  {% link_tags site.data.includes.icons %}

  {% page_meta %}
  {% structured_data %}

  <link rel="stylesheet" href="{{ '/lib/swagger-ui/swagger-ui.css' | relative_url }}" />
  {% gtm_head site.gtm %}
</head>
<body>
{% gtm_body site.gtm %}
{{ content }}

<div id="swagger-ui"></div>
<script src="{{ '/lib/swagger-ui/swagger-ui-bundle.js' | relative_url }}"></script>
<script>
  window.onload = () => {
    window.ui = SwaggerUIBundle({
      url: '{% vlink /swagger/{{ page.swagger }}.json %}',
      dom_id: '#swagger-ui',

      // Minimize display options
      defaultModelsExpandDepth: -1,     // Hide schemas section completely [web:46][web:47]
      defaultModelExpandDepth: 1,       // Limit model detail expansion [web:47]
      docExpansion: "list",             // Only show tags, collapse operations [web:47]
      displayRequestDuration: true,     // Show request timing (useful)
      filter: false,                    // Enable search/filter bar

      // Optional: further minimization
      deepLinking: false,               // Enable deep linking to operations
      displayOperationId: false,        // Hide operation IDs [web:47]
      showExtensions: false,            // Hide vendor extensions
      supportedSubmitMethods: [],       // Disable "Try it out" button
      showCommonExtensions: false       // Hide common extensions
    });
  };

</script>
</body>
</html>
