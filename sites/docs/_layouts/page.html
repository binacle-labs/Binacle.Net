<!DOCTYPE html>
<html lang="{{ page.hreflang }}">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    {% link_tags site.data.includes.icons %}

    {% page_meta %}
    {% structured_data %}
    {% link_tags site.data.includes.links %}
    {% gtm_head site.gtm %}
</head>
<body class="{{ site.default_theme }}">
    {% gtm_body site.gtm %}
    {{ content }}

    {% script_tags site.data.includes.scripts_body_end %}
</body>
</html>
