<!DOCTYPE html>
<html lang="{{ page.hreflang }}" data-default-theme="{{ site.default_theme }}" data-theme-storage="{{ site.theme_storage | default: 'cookie' }}"{% if site.cookie_domain %} data-theme-domain="{{ site.cookie_domain }}"{% endif %}>
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    {% link_tags site.data.includes.icons %}

    {% page_meta %}
    {% structured_data %}
    {% link_tags site.data.includes.links %}
    <script src="{{ '/js/theme-init.js' | relative_url }}"></script>
    {% gtm_head site.gtm %}
</head>
<body>
    {% gtm_body site.gtm %}
    {{ content }}

    {% script_tags site.data.includes.scripts_body_end %}
</body>
</html>
