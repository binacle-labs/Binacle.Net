################################################################
# Site settings
################################################################
title                   : "Binacle.Net Docs"

# The link-preview image every page falls back to. A page overrides it with og_image.
og_image                : /media/logo/binacle-logo-512x512.png
description             : >-
  Binacle.Net answers which box an order goes in, in milliseconds. Docs for the free and open source 3D bin
  packing API you host yourself.

author:
  name                  : "Chris Mavrommatis"
  url                   : "https://github.com/ChrisMavrommatis"
  
# the base hostname & protocol for your site, e.g. http://example.com# Welcome to Jekyll!
url                     : "http://localhost:7195"
api_url                 : "https://localhost:7194"
gtm                     : ''

logo:
  src                  : /media/logo/binacle-logo-512x512a.png
  alt                  : "Binacle.Net Logo"

default_theme: "dark"
theme_storage: "cookie"
################################################################
# Where things are
################################################################
source              : ./
destination         : ../../artifacts/docs
collections_dir     : collections
plugins_dir         : _plugins       # takes an array of strings and loads plugins in that order
layouts_dir         : _layouts
includes_dir        : _includes
data_dir            : _data
sass:
  sass_dir          : _sass
  cache             : false
  style             : compressed
collections:
  versions:
    output          : true
    permalink       : /version/:path/
  common_pages:
    output          : true
    permalink       : /:path/

################################################################
# Handling Reading
################################################################
safe                : false
include             :
  - ".htaccess"
exclude             :
  - "Gemfile"
  - "Gemfile.lock"
  - "node_modules"
  - "vendor/bundle/"
  - "vendor/cache/"
  - "vendor/gems/"
  - "vendor/ruby/"
  - "*.proj"
  - "obj/*"
  - "bin/*"
  - "README.md"
  - "_js"
  - "package.json"
  - "package-lock.json"
  - "webpack.config.js"
  - "tsconfig.json"
keep_files          : [".git", ".svn"]
encoding            : "utf-8"
markdown_ext        : "markdown,mkdown,mkdn,mkd,md"
strict_front_matter : false
################################################################
# Filtering Content
################################################################
show_drafts         : false
limit_posts         : 0
future              : false
unpublished         : false

################################################################
# Serving
################################################################
detach              : false
port                : 7195
host                : 127.0.0.1
baseurl             : ""    # does not include hostname
show_dir_listing    : false
disable_disk_cache  : true

################################################################
# Conversion
################################################################
markdown            : kramdown
highlighter         : rouge
lsi                 : false
excerpt_separator   : "\n\n"
incremental         : false

################################################################
# Outputting
################################################################
permalink           : date        #pretty
paginate_path       : /page:num
timezone            : "Europe/Athens"
quiet               : false
verbose             : false
liquid:
  error_mode        : warn
  strict_filters    : false
  strict_variables  : false

################################################################
# Markdown Processors
################################################################
kramdown:
  auto_ids          : true
  entity_output     : as_char
  toc_levels        : '1..6'
  smart_quotes      : lsquo,rsquo,ldquo,rdquo
  input             : GFM
  hard_wrap         : false
  footnote_nr       : 1
  show_warnings     : false
  parse_block_html  : true

################################################################
# Plugins
################################################################
whitelist           : []
plugins             :
  - jekyll-tidy
  - jekyll-gtm
  - jekyll-filters
  - jekyll-multi-sitemap
  - jekyll-resource-tags
  - jekyll-page-meta
  - jekyll-structured-data
  - jekyll-breadcrumb-trail
  - binacle-docs-versions

################################################################
# Front Matter Defaults
################################################################
defaults:
  -
    scope:
      path           : "pages/**"
      type           : "pages"
    values:
      layout          : "default"
      locale          : "en_US"
      hreflang        : "en"
      nav:
        order         : 99
      sitemap:
        lastmod		 : "current"
        changefreq	 : "monthly"
        priority	 : 1.0
        exclude      : false
  -
    scope:
      path            : "**/**"
      type            : "common_pages"
    values:
      layout          : "default"
      locale          : "en_US"
      hreflang        : "en"
      nav:
        order         : 99
      sitemap:
        lastmod       : "current"
        changefreq    : "monthly"
        priority      : 1.0
        exclude       : false
  -
    scope:
      path           : "**/**"
      type           : "versions"
    values:
      layout          : "versions/default"
      path_prefix     : "version"
      locale          : "en_US"
      hreflang        : "en"
      sitemap:
        lastmod		 : "current"
        changefreq	 : "monthly"
        priority	 : 1.0
        exclude      : false
      nav:
        order        : 99
  # Without this the seven swagger pages become indexable: the noindex their layout hardcoded is gone.
  - scope:
      path            : "**/swagger/**"
      type            : "versions"
    values:
      robots          : "noindex, nofollow"
  # One scope block per version folder. A version without one is invisible - see _data/versions.yml.
  #
  # version_tag is a real docker tag, the one every page pulls with. It is NOT the folder label: "2.1.x" is not
  # a tag that exists, so writing the label here published a docker run command that failed for the reader.
  # A closed line carries its newest patch (1.3.0, 2.0.1, 2.1.1) - it will get no further release, and no
  # moving tag was ever published for it. The current line carries the minor tag ("3.0"), which the release
  # workflow publishes and which resolves to the newest patch, so it needs no edit when 3.0.1 ships.
  -
    scope:
      path: "**/v1.3.x/**"
      type: "versions"
    values:
      version: "v1.3.x"
      version_tag: "1.3.0"
  - scope:
      path: "**/v2.0.x/**"
      type: "versions"
    values:
      version: "v2.0.x"
      version_tag: "2.0.1"
  - scope:
      path: "**/v2.1.x/**"
      type: "versions"
    values:
      version: "v2.1.x"
      version_tag: "2.1.1"
  - scope:
      path: "**/v3.0.x/**"
      type: "versions"
    values:
      version: "v3.0.x"
      version_tag: "3.0"
  # Swagger pages are noindex - they are a UI shell, not a page to land on. A sitemap that lists a noindex URL
  # is an error in Search Console, so they are kept out of it. Longest matching path wins, so this beats the
  # `**/**` block above.
  - scope:
      path: "**/swagger/**"
      type: "versions"
    values:
      sitemap:
        exclude: true



################################################################
################### END OF BASE CONFIG #####################
################################################################


################################################################
# jekyll-tidy
################################################################
jekyll_tidy:
  exclude       :         # an array of files to exclude from tidying.
    - "**/*.txt"
    - "**/*.json"
    - "*.xml"
  ignore_env    : null     # a JEKYLL_ENV string on which to skip tidying entirely.
  compress_html : false    # a flag for whether or not to compress the HTML output

################################################################
# jekyll-multi-sitemap
################################################################
sitemaps:
  path: /sitemap
  index: /sitemap.xml      # the path a crawler probes unasked. This site had nothing there
  files:
    - name: pages
      include: [pages, common_pages]
    - name: version-current
      include: [versions]
      where:
        version: $site.data.versions.current

################################################################
# jekyll-page-meta
################################################################
page_meta:
  title_separator: " - "

################################################################
# jekyll-breadcrumb-trail
################################################################
breadcrumbs:
  exclude: ["version", "*.*"]
  class: tiny-space
  title_from: [menu_title, title]
  home:
    html: '<i class="small">home</i>'

################################################################
# jekyll-structured-data
################################################################
structured_data:
  default_type: WebPage
  # Written out in full, and identical in all three configs. Derived from site.url it would be a
  # different organisation on each host.
  organization:
    "@id": https://www.binacle.net/#organization
    name: Binacle.Net
    url: https://www.binacle.net/
    logo: /media/logo/binacle-logo-512x512.png
    same_as:
      - https://github.com/binacle-labs
      - https://hub.docker.com/r/binacle/binacle-net
