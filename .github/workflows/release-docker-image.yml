# Seven jobs, cheapest check first:
#
#   dispatch 3.0.0 -> gate -> test -> build+push GHCR -> smoke -> copy to Docker Hub -> release -> page

name: Build and Release Docker Image

# A dispatch is listed against main, because the tag does not exist until the last job. Without this the
# Actions list shows the commit message and nothing says which release a run was.
run-name: Release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, with no leading v (e.g. 3.0.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  # GHCR rejects an uppercase path, so this is written out rather than derived from the owner name.
  STAGING_IMAGE: ghcr.io/binacle-labs/binacle-net

# Never cancelled: a stop between `build` and `publish` strands a staged image or half-moves the Docker Hub
# tags.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}

    outputs:
      section: ${{ steps.section.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup - just
        uses: ./.github/actions/setup-just

      - name: Check the dispatch is on main
        env:
          REF: ${{ github.ref }}
        run: just ci check-release-ref "$REF"

      - name: Check the version is semver
        run: just ci check-version "$VERSION"

      - name: Check the tag is free
        env:
          COMMIT: ${{ github.sha }}
        run: just ci check-release-tag "$TAG" "$COMMIT"

      - name: Which section this version publishes
        id: section
        run: just ci changelog-section "$VERSION" | tee -a "$GITHUB_OUTPUT"

      - name: Check the section exists
        env:
          SECTION: ${{ steps.section.outputs.name }}
        run: just changelog check "$SECTION"

  test:
    name: Image tests
    needs: gate
    uses: ./.github/workflows/shared-image-tests.yml
    permissions:
      contents: read

  build:
    name: Build and push to GHCR
    needs: [ gate, test ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    outputs:
      staging: ${{ steps.ref.outputs.staging }}
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup - .NET
        uses: ./.github/actions/setup-dotnet
        with:
          dotnet-version: ${{ vars.DONET_VERSION }}

      - name: Setup - just
        uses: ./.github/actions/setup-just

      # `just build publish` bundles the UI module's javascript before dotnet collects the static web
      # assets. Without node the image ships demo pages that render and do nothing, and no step fails.
      - name: Setup - Node
        uses: ./.github/actions/setup-node

      - name: Install npm packages
        run: npm ci --ignore-scripts

      - name: Publish
        run: just build publish

      # Only the immutable tag. The moving tags are computed in `publish`, the job that creates them.
      # `value=` is what type=semver reads here: a dispatch has no tag ref to take a version from.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.STAGING_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-only AND CC-BY-4.0 AND Apache-2.0 AND MIT
            org.opencontainers.image.url=https://www.binacle.net
            org.opencontainers.image.description=Binacle.Net answers which box an order goes in, and whether it fits, in milliseconds.

      - name: Assemble the staging reference
        id: ref
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: echo "staging=${STAGING_IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push to staging
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stated rather than left to buildx's defaults, so it stays a choice.
          provenance: mode=max
          sbom: true

          # metadata-action's version, so BINACLE_VERSION and the image tag cannot disagree.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}

      # The `provenance:` above is buildkit's, inlined in the index and signed by nothing of its own - the
      # cosign signature covers it only because it covers the whole index. This one is a provenance statement
      # GitHub signs, which is what a SLSA verifier can actually read, and it is the step between build level
      # 1 and 2. It binds to the digest, so the Docker Hub copy of that digest is covered by it too.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.STAGING_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Setup cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the staging image
        env:
          TARGET: ${{ steps.ref.outputs.staging }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$TARGET"

  smoke:
    name: Smoke the staged image
    needs: build
    uses: ./.github/workflows/shared-smoke-image.yml
    permissions:
      contents: read
      packages: read
    with:
      image: ${{ needs.build.outputs.staging }}

  publish:
    name: Copy to Docker Hub
    needs: [ build, smoke ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      id-token: write

    outputs:
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup - just
        uses: ./.github/actions/setup-just

      - name: Docker metadata - public tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.DOCKERHUB_ORGNAME }}/${{ vars.DOCKERHUB_REPO }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
          flavor: |
            latest=auto

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Setup cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # A copy by digest, never a rebuild. Rebuilding here would publish an image the smoke never saw.
      #
      # The immutable tag goes over on its own, and `3.0` and `latest` wait below until the digest is signed
      # and the signature has been checked. Moving them first means a failed sign leaves the tag most people
      # pull sitting on an unsigned image, with the run red and nothing published saying so.
      - name: Which tags move
        id: moving
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMMUTABLE: ${{ vars.DOCKERHUB_ORGNAME }}/${{ vars.DOCKERHUB_REPO }}:${{ needs.build.outputs.version }}
        run: just ci moving-tags "$IMMUTABLE" "$TAGS" | tee -a "$GITHUB_OUTPUT"

      - name: Copy the smoked digest to Docker Hub
        env:
          SOURCE: ${{ needs.build.outputs.staging }}@${{ needs.build.outputs.digest }}
          IMMUTABLE: ${{ vars.DOCKERHUB_ORGNAME }}/${{ vars.DOCKERHUB_REPO }}:${{ needs.build.outputs.version }}
        run: just ci copy-tags "$SOURCE" "$IMMUTABLE"

      # Not a duplicate of the build job's: a signature does not come across with the copy.
      - name: Sign the published image
        env:
          TARGET: ${{ vars.DOCKERHUB_ORGNAME }}/${{ vars.DOCKERHUB_REPO }}@${{ needs.build.outputs.digest }}
        run: cosign sign --yes "$TARGET"

      # The command `SECURITY.md` hands to readers, run here against what was just pushed. One recipe, so the
      # published instructions and the registry cannot drift apart without this step going red.
      - name: Verify the published signature
        env:
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ vars.DOCKERHUB_ORGNAME }}/${{ vars.DOCKERHUB_REPO }}
        # Retried because Docker Hub's referrers index is eventually consistent and this reads it seconds
        # after the sign. The recipe stays one shot: a reader running it wants an answer, not a wait.
        run: |
          for attempt in 1 2 3 4 5; do
            just image verify "$VERSION" signature refs/heads/main "$REPO" && exit 0
            echo "Not readable yet, attempt ${attempt}. Waiting 15s."
            sleep 15
          done
          exit 1

      # Only now. Everything above has to be green for `3.0` and `latest` to point anywhere new.
      - name: Move the tags that move
        if: steps.moving.outputs.moving != ''
        env:
          SOURCE: ${{ needs.build.outputs.staging }}@${{ needs.build.outputs.digest }}
          MOVING: ${{ steps.moving.outputs.moving }}
        run: just ci copy-tags "$SOURCE" "$MOVING"

  release:
    name: Create the release
    needs: [ gate, test, build, smoke, publish ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    env:
      TAG: v${{ inputs.version }}
      COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup - just
        uses: ./.github/actions/setup-just

      # One call makes the tag and the release, so the image can never be out with no tag naming it. On the
      # run's own commit, not whatever main points at by now, so the tag and the image agree.
      #
      # A release may already exist: tagging from GitHub's web UI creates the tag and the release together.
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECTION: ${{ needs.gate.outputs.section }}
        run: just ci github-release "$TAG" "$SECTION" "$COMMIT"

      # In this job rather than `publish` because the release URL only exists once the step above has run.
      - name: Summarise what was published
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          VERSION: ${{ needs.build.outputs.version }}
          TAGS: ${{ needs.publish.outputs.tags }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ inputs.version }}
        run: just ci release-summary "$VERSION" "$DIGEST" "$TAG" "$RELEASE_URL" "$TAGS"

  # The one job with its own prerelease condition: a beta must not rewrite a page describing the stable line.
  page:
    name: Docker Hub page
    needs: [ build, publish, release ]
    if: ${{ !contains(inputs.version, '-') }}
    uses: ./.github/workflows/shared-dockerhub-overview.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.build.outputs.version }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
