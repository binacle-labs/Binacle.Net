name: Deploy Demo Site

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  suite:
    name: Site tests
    uses: ./.github/workflows/shared-site-tests.yml
    permissions:
      contents: read

  deploy:
    name: Build and deploy the site
    needs: suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    environment:
      name: binacle-net-demo
      url: https://demo.binacle.net

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build - demo site
        uses: ./.github/actions/build-jekyll-site
        with:
          site: demo
          directory: sites/demo

      - name: Install - lychee
        uses: ./.github/actions/install-lychee

      - name: Check - links
        run: just check links demo

      # The label Cloudflare files the deploy under, read below as env.DEPLOY_MESSAGE.
      - name: Describe the deploy
        run: just ci deploy-message "$GITHUB_SHA" | tee -a "$GITHUB_ENV"

      # Uploads what the link check just read - artifacts/demo, set as `directory` in the config file.
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config tooling/cloudflare/demo.wrangler.jsonc --message "${{ env.DEPLOY_MESSAGE }}"

  tag:
    name: Tag the deployed commit
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    env:
      TAG_NAME: demo-${{ github.run_number }}
      COMMIT: ${{ github.sha }}
      URL: https://demo.binacle.net

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup - just
        uses: ./.github/actions/setup-just

      - name: Push the marker tag
        run: just ci push-tag "$TAG_NAME" "$COMMIT"

      - name: Summarise the deploy
        run: just ci deploy-summary "$COMMIT" "$TAG_NAME" "$URL"
