# CodeQL, one job per language. Findings land in the repo's Security tab, not on a check.
#
# Every language runs buildless (`build-mode: none`), so no job installs a toolchain.

name: CodeQL Analysis

on:
  push:
    branches:
      - main

  # The query packs change, so the same commit reports new findings weeks later.
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:

# Cancellable: the Security tab shows the branch's latest state, so superseded findings get overwritten.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyse (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    strategy:
      # One language failing must not hide the other three.
      fail-fast: false
      matrix:
        language:
          # Workflow and action shell. actionlint reads these files but never looks for injection.
          - actions
          - csharp
          - javascript-typescript
          # The Jekyll plugins under ruby/, and the sites' own.
          - ruby

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          # Keeps each language's findings a separate set. Without it the last job to finish clears the rest.
          category: /language:${{ matrix.language }}

  # No page in the run says how many alerts are open once the matrix has finished.
  summary:
    name: Summarise open alerts
    needs: analyze
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup - just
        uses: ./.github/actions/setup-just

      - name: Count the open alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          BRANCH: ${{ github.ref_name }}
          # A failed matrix leg means the counts are missing that language's findings, not that it has none.
          ANALYSIS: ${{ needs.analyze.result }}
        run: just ci codeql-summary "$REPO" "$REF" "$BRANCH" "$ANALYSIS"
