#   changes -> image tests, image build, site tests, site build, lint -> gate
#
# `gate` is the only name branch protection holds. Never move the image build into the test suite - the
# release calls that file whole and would build a throwaway image every time.

name: Pull Request

on:
  pull_request:

# Cancellable: a superseded run leaves nothing behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Work out what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.paths.outputs.code }}
      site: ${{ steps.paths.outputs.site }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The recipe diffs base...head, which needs the merge base a shallow clone does not have.
          fetch-depth: 0

      - name: Setup - just
        uses: ./.github/actions/setup-just

      - name: Work out what changed
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: just ci changed-paths "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"

  test-suite:
    name: Image tests
    needs: changes
    if: ${{ needs.changes.outputs.code == 'yes' }}
    uses: ./.github/workflows/shared-image-tests.yml
    permissions:
      contents: read

  site-tests:
    name: Site tests
    needs: changes
    if: ${{ needs.changes.outputs.site == 'yes' }}
    uses: ./.github/workflows/shared-site-tests.yml
    permissions:
      contents: read

  image:
    name: Image build
    needs: changes
    if: ${{ needs.changes.outputs.code == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup - just
        uses: ./.github/actions/setup-just

      - name: Setup - .NET
        uses: ./.github/actions/setup-dotnet
        with:
          dotnet-version: ${{ vars.DONET_VERSION }}

      # `just build image` reaches `publish`, which bundles the UI module's javascript. Without node the
      # bundlers resolve out of a node_modules nothing installed, and this job fails.
      - name: Setup - Node
        uses: ./.github/actions/setup-node

      - name: Install npm packages
        run: npm ci --ignore-scripts

      - name: Build - image
        run: just build image

  site-build:
    name: Site build
    needs: changes
    if: ${{ needs.changes.outputs.site == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        site: [ docs, demo, www ]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build - site
        uses: ./.github/actions/build-jekyll-site
        with:
          site: ${{ matrix.site }}
          directory: sites/${{ matrix.site }}

      - name: Install - lychee
        uses: ./.github/actions/install-lychee

      - name: Check - links
        env:
          SITE: ${{ matrix.site }}
        run: just check links "$SITE"

  workflows:
    name: Lint
    needs: changes
    if: ${{ needs.changes.outputs.code == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup - just
        uses: ./.github/actions/setup-just

      - name: Install - actionlint
        uses: ./.github/actions/install-actionlint

      - name: Check - workflows
        run: just check workflows

      - name: Check - actions
        if: ${{ !cancelled() }}
        run: just check actions

      # shellcheck ships on the runner, so nothing is installed for this one.
      - name: Check - scripts
        if: ${{ !cancelled() }}
        run: just check scripts

  gate:
    name: Gate
    needs: [ changes, test-suite, site-tests, image, site-build, workflows ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup - just
        uses: ./.github/actions/setup-just

      - name: Check every job above
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: just ci gate "$RESULTS"
