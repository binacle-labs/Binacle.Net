name: Deploy Site
run-name: Deploy ${{ inputs.site }}

# Everything a deploy needs - the environment, the URL, the source directory, the wrangler config, the marker
# tag - is derived from the site chosen at dispatch.
on:
  workflow_dispatch:
    inputs:
      site:
        description: 'The site to deploy'
        required: true
        type: choice
        options:
          - docs
          - demo
          - www

# One site queues behind itself; two sites deploy side by side.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.site }}
  cancel-in-progress: false

jobs:
  suite:
    name: Site tests
    uses: ./.github/workflows/shared-site-tests.yml
    permissions:
      contents: read

  deploy:
    name: Build and deploy the site
    needs: suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    environment:
      name: binacle-net-${{ inputs.site }}
      url: https://${{ inputs.site }}.binacle.net

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build - site
        uses: ./.github/actions/build-jekyll-site
        with:
          site: ${{ inputs.site }}
          directory: sites/${{ inputs.site }}

      - name: Install - lychee
        uses: ./.github/actions/install-lychee

      - name: Check - links
        env:
          SITE: ${{ inputs.site }}
        run: just check links "$SITE"

      # The label Cloudflare files the deploy under, read below as env.DEPLOY_MESSAGE.
      - name: Describe the deploy
        run: just ci deploy-message "$GITHUB_SHA" | tee -a "$GITHUB_ENV"

      # Uploads what the link check just read - artifacts/<site>, set as `directory` in the config file.
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config tooling/cloudflare/${{ inputs.site }}.wrangler.jsonc --message "${{ env.DEPLOY_MESSAGE }}"

  tag:
    name: Tag the deployed commit
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    env:
      TAG_NAME: ${{ inputs.site }}-${{ github.run_number }}
      COMMIT: ${{ github.sha }}
      URL: https://${{ inputs.site }}.binacle.net

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup - just
        uses: ./.github/actions/setup-just

      - name: Create the marker tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: just ci create-tag "$TAG_NAME" "$COMMIT"

      - name: Summarise the deploy
        run: just ci deploy-summary "$COMMIT" "$TAG_NAME" "$URL"
