# Sends coverage to SonarCloud. The build and the coverage run stay between `Sonar begin` and `Sonar end`.
#
# Only the key, org, token and host are set below. Everything else the scanner needs is in the file `/s:`
# names.

name: Sonar Analysis

on:
  # By hand only - no schedule, and no pull request trigger yet.
  workflow_dispatch:

# Cancellable: SonarCloud shows the branch's latest state, so superseded numbers get overwritten anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyse and publish
    runs-on: ubuntu-latest
    # Full build plus every suite under coverage. The slowest workflow here.
    timeout-minutes: 45
    permissions:
      contents: read

    # Same images and health checks as shared-image-tests.yml. Without them the four Postgres and Azure
    # Tables repositories report 0% while their tests exist and pass.
    services:
      # Table storage on 10002 is the only endpoint the tests use. The other two are mapped because the
      # emulator's "UseDevelopmentStorage=true" shorthand names all three, and a missing one reads as a
      # connection failure rather than as an unused port.
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.36.0
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002
        # nc, not curl: the image is alpine-based and ships busybox, not curl.
        options: >-
          --health-cmd "nc -z 127.0.0.1 10002"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: appuser
          POSTGRES_DB: binacle_net
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appuser -d binacle_net"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup - just
        uses: ./.github/actions/setup-just

      - name: Setup - .NET
        uses: ./.github/actions/setup-dotnet
        with:
          dotnet-version: ${{ vars.DONET_VERSION }}

      - name: Setup - Node
        uses: ./.github/actions/setup-node

      # `just coverage all` runs the gem tests too, and without this they cannot start.
      - name: Setup - Ruby
        uses: ./.github/actions/setup-ruby
        with:
          working-directory: ruby

      - name: Install npm packages
        run: npm ci --ignore-scripts

      # The analyzer cache only - the NuGet one comes with the .NET setup above.
      - name: Cache Sonar analyzers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Restore tools
        run: dotnet tool restore

      - name: Sonar begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          dotnet dotnet-sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /s:"$GITHUB_WORKSPACE/tooling/ci/sonar-analysis.xml"

      # Build once here so the coverage run below can --no-build.
      - name: Build
        run: dotnet build Binacle.Net.slnx --configuration Release

      - name: Coverage
        env:
          DOTNET_TEST_ARGS: --configuration Release --no-build
        run: just coverage all sonar all-with-services

      - name: Sonar end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      # The recipe waits for SonarCloud to finish processing. `end` returns when the upload does, so reading
      # the gate straight away returns the previous run's numbers.
      - name: Summarise the quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: just ci sonar-summary .sonarqube/out/.sonar/report-task.txt "$COMMIT" "$BRANCH"
