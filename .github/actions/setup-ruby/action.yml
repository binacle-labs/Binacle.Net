name: Setup Ruby
description: Install Ruby and the site's gems. Unlike the other setup actions this one does install packages -
  see `bundler-cache` below.

inputs:
  working-directory:
    description: Directory holding the Gemfile - the site, not the repository root.
    required: true
  ruby-version:
    description: Ruby version.
    required: false
    default: '3.4.7'

runs:
  using: composite
  steps:
    # bundler-cache is one flag that installs the gems and caches them off Gemfile.lock. It is both halves
    # or neither.
    - name: Install Ruby and the gems
      uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
      with:
        ruby-version: ${{ inputs.ruby-version }}
        bundler-cache: true
        working-directory: ${{ inputs.working-directory }}
