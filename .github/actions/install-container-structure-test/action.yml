name: Install container-structure-test
description: Install the container-structure-test binary, pinned by version and SHA-256.

runs:
  using: composite
  steps:
    # A door onto the script, which holds the version, the checksum and the download. A local action is read
    # out of the working copy, so the repository is always there by the time this runs.
    - name: Install container-structure-test
      shell: bash
      run: tooling/ci/install-container-structure-test.sh
