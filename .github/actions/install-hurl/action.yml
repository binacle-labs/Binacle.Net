name: Install hurl
description: Install the hurl binary, pinned by version and SHA-256.

runs:
  using: composite
  steps:
    # A door onto the script, which holds the version, the checksum and the download. A local action is read
    # out of the working copy, so the repository is always there by the time this runs.
    - name: Install hurl
      shell: bash
      run: tooling/ci/install-hurl.sh
