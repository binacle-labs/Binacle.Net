name: Setup Node
description: Install Node and restore the npm cache. Does not install packages - the caller runs `npm ci`.

inputs:
  node-version:
    description: Node major version.
    required: false
    default: '22'

runs:
  using: composite
  steps:
    - name: Install Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
