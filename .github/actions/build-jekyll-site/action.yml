name: Build Jekyll site
description: Build one of the three Jekyll sites as a pre-flight check. Deploying is the caller's job.

inputs:
  site:
    description: The site's name - `docs`, `demo` or `www`. Names the `just build` recipe.
    required: true
  directory:
    description: The site's directory, holding its Gemfile - `sites/docs`, `sites/demo` or `sites/www`.
      Separate from the name because the sites sit under a parent directory.
    required: true

runs:
  using: composite
  steps:
    - name: Setup - just
      uses: ./.github/actions/setup-just

    - name: Setup - Node
      uses: ./.github/actions/setup-node

    - name: Install npm packages - root
      shell: bash
      run: npm ci --ignore-scripts

    - name: Setup - Ruby
      uses: ./.github/actions/setup-ruby
      with:
        working-directory: ${{ inputs.directory }}

    - name: Build - site
      shell: bash
      env:
        SITE: ${{ inputs.site }}
      run: just build "$SITE"
