name: Setup just
description: Install the just task runner at the version this repo's module files need.

runs:
  using: composite
  steps:
    # Not `latest`, and not Ubuntu's apt just, which cannot parse module files.
    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      with:
        just-version: '^1.45'

    # Last line, like the install-* actions: a red step then names the tool.
    - name: just version
      shell: bash
      run: just --version
