name: Setup .NET
description: Install the .NET SDK and restore the NuGet package cache.

inputs:
  dotnet-version:
    # An input because `vars` does not exist inside an action. Empty installs a default SDK and looks like it
    # worked.
    description: SDK version. Pass the DONET_VERSION repo variable.
    required: true

runs:
  using: composite
  steps:
    - name: Install the .NET SDK
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Restore the NuGet package cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
        restore-keys: ${{ runner.os }}-nuget-
